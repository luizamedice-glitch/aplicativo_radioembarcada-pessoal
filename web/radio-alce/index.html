<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070808" />
  <meta name="description" content="Rádio Alce. Sua Rádio em Movimento. Ouça ao vivo." />
  <meta property="og:title" content="Rádio Alce" />
  <meta property="og:description" content="Sua Rádio em Movimento. Ouça ao vivo." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://radioalce.vercel.app/" />
  <meta property="og:image" content="https://radioalce.vercel.app/alce-logo.png" />
  <link rel="icon" type="image/png" href="/alce-logo.png" />
  <title>Rádio Alce — Sua Rádio em Movimento</title>
</head>
<body>
  <main class="radio" aria-label="Rádio Alce">
    <svg class="background-curves" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"><path d="M-300 640 C240 320 700 900 1300 280"/><path d="M-300 658 C240 338 700 918 1300 298"/><path d="M-300 676 C240 356 700 936 1300 316"/></svg>
    <div class="player">
      <div class="top-space"></div>
      <header class="logo-header"><img class="logo" src="/alce-logo.png" alt="Logo Alce — Rádio Alce" width="1254" height="1254" fetchpriority="high" /></header>
      <div class="live-badge" aria-label="Rádio em espera">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="1.5"/><path d="M7.8 7.4a6.2 6.2 0 0 0 0 9.2M16.2 7.4a6.2 6.2 0 0 1 0 9.2M4.3 3.8a11 11 0 0 0 0 16.4M19.7 3.8a11 11 0 0 1 0 16.4"/></svg>
        <span>AO VIVO</span>
      </div>
      <p class="tagline">Sua Rádio em Movimento</p>
      <div class="middle-space"></div>
      <canvas class="waveform" role="img" aria-label="Onda sonora pausada"></canvas>
      <div class="controls">
        <button class="volume" id="volume-down" type="button" aria-label="Diminuir volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M2.4 8.6H6.5L11.3 4.3V19.7L6.5 15.4H2.4Z"/><path class="sign" d="M15.1 12H22.8"/></svg></button>
        <button class="play-pause" type="button" aria-label="Reproduzir rádio" aria-pressed="false"><svg class="play-icon" viewBox="0 0 34 34" aria-hidden="true"><path d="M9.5 2.7L29.9 17 9.5 31.3Z"/></svg><svg class="pause-icon" viewBox="0 0 34 34" aria-hidden="true"><rect x="6.1" y="4.1" width="7.5" height="25.8" rx="2"/><rect x="20.4" y="4.1" width="7.5" height="25.8" rx="2"/></svg></button>
        <button class="volume" id="volume-up" type="button" aria-label="Aumentar volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="speaker" d="M2.4 8.6H6.5L11.3 4.3V19.7L6.5 15.4H2.4Z"/><path class="sign" d="M15.1 12H22.8M19 8.2V15.8"/></svg></button>
      </div>
      <div class="bottom-space"></div>
    </div>
    <audio id="radio-audio" preload="none" playsinline></audio>
    <span class="sr-only" id="status" role="status" aria-live="polite">Rádio em espera</span>
  </main>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
