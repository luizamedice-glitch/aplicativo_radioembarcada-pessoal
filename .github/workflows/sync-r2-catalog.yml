name: Sincronizar catálogo R2

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Catálogo musical, peças aprovadas ou inventário
        type: choice
        default: music
        options: [music, programming, jingles, inventory]

concurrency:
  group: r2-library-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: 6d1b0b06fe5ec1fc684e9ab00fca8e0f
  R2_BUCKET: tuaradio
  R2_PUBLIC_BASE: https://pub-e38948fd737d4d969bb4e65eebed0249.r2.dev
  R2_MUSIC_PREFIX: music/

jobs:
  access_key:
    name: 1A - Validar Access Key ID
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar R2_ACCESS_KEY_ID
        env:
          VALUE: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          test -n "$VALUE" || { echo "::error::R2_ACCESS_KEY_ID está ausente ou vazio"; exit 11; }
          echo "R2_ACCESS_KEY_ID disponível."

  secret_key:
    name: 1B - Validar Secret Access Key
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar R2_SECRET_ACCESS_KEY
        env:
          VALUE: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$VALUE" || { echo "::error::R2_SECRET_ACCESS_KEY está ausente ou vazio"; exit 12; }
          echo "R2_SECRET_ACCESS_KEY disponível."

  r2_access:
    name: 2 - Testar acesso ao R2
    needs: [access_key, secret_key]
    runs-on: ubuntu-latest
    steps:
      - name: Garantir AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y awscli
          fi
          aws --version

      - name: Testar bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-bucket             --bucket "$R2_BUCKET"             --endpoint-url "$ENDPOINT"
          echo "Acesso ao bucket '$R2_BUCKET': OK"

  sync:
    if: inputs.operation == 'music'
    name: 3 - Regenerar e publicar catálogo
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y awscli
          fi

      - name: Listar biblioteca atual
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2             --bucket "$R2_BUCKET"             --prefix "$R2_MUSIC_PREFIX"             --endpoint-url "$ENDPOINT"             --query 'Contents[].Key'             --output json > /tmp/r2_music_keys.json
          python3 - <<'PY'
          import json
          with open('/tmp/r2_music_keys.json', encoding='utf-8') as f:
              keys = json.load(f) or []
          count = sum(isinstance(k, str) and k.lower().endswith('.mp3') for k in keys)
          print(f"MP3 encontrados no R2: {count}")
          if count <= 0:
              raise SystemExit("Nenhum MP3 encontrado em music/")
          PY

      - name: Baixar catálogo anterior
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp             "s3://${R2_BUCKET}/music_catalog.json"             /tmp/old_music_catalog.json             --endpoint-url "$ENDPOINT"           || echo '{}' > /tmp/old_music_catalog.json

      - name: Gerar catálogo
        run: |
          python3 scripts/sync_r2_catalog.py             --keys /tmp/r2_music_keys.json             --old-catalog /tmp/old_music_catalog.json             --output /tmp/music_catalog.json             --public-base "$R2_PUBLIC_BASE"             --prefix "$R2_MUSIC_PREFIX"

      - name: Publicar music_catalog.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp             /tmp/music_catalog.json             "s3://${R2_BUCKET}/music_catalog.json"             --content-type "application/json; charset=utf-8"             --cache-control "no-cache, max-age=0"             --endpoint-url "$ENDPOINT"

      - name: Validar catálogo publicado no próprio R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp             "s3://${R2_BUCKET}/music_catalog.json"             /tmp/published_music_catalog.json             --endpoint-url "$ENDPOINT"
          python3 - <<'PY'
          import json, os
          with open('/tmp/published_music_catalog.json', encoding='utf-8') as f:
              data = json.load(f)
          count = len(data.get('items', []))
          version = data.get('version')
          assert count > 0, 'Catálogo publicado ficou vazio'
          summary = f"Catálogo R2 sincronizado: versão {version}, {count} músicas."
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary + '\n')
          PY

  programming:
    name: Publicar peças aprovadas
    if: inputs.operation == 'programming' || inputs.operation == 'jingles'
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ADDITIONS_FILE: ${{ inputs.operation == 'jingles' && 'scripts/jingle-additions.json' || 'scripts/station-id-additions.json' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - name: Testar merge e validar arquivos no bucket
        run: |
          python3 -m unittest discover -s scripts -p 'test_update_r2_programming.py' -v
          python3 - <<'PYTHON'
          import json, os, subprocess
          from urllib.parse import unquote, urlsplit
          endpoint = 'https://' + os.environ['R2_ACCOUNT_ID'] + '.r2.cloudflarestorage.com'
          for item in json.load(open(os.environ['ADDITIONS_FILE'])):
              result = subprocess.check_output(['aws', 's3api', 'head-object', '--bucket', os.environ['R2_BUCKET'],
                  '--key', unquote(urlsplit(item['url']).path.lstrip('/')), '--endpoint-url', endpoint])
              assert json.loads(result)['ContentLength'] > 0
              print('Audio available: ' + item['id'])
          PYTHON
      - name: Baixar configuração atual e guardar backup
        run: |
          aws s3 cp "s3://${R2_BUCKET}/programming.json" /tmp/programming-before.json \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - uses: actions/upload-artifact@v4
        with:
          name: programming-backup
          path: /tmp/programming-before.json
          retention-days: 30
          if-no-files-found: error
      - name: Mesclar preservando regras e peças existentes
        run: |
          python3 scripts/update_r2_programming.py --current /tmp/programming-before.json \
            --additions "$ADDITIONS_FILE" --output /tmp/programming.json
      - name: Publicar e conferir programação
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET}/programming.json" /tmp/programming-check.json --endpoint-url "$ENDPOINT"
          cmp /tmp/programming-before.json /tmp/programming-check.json || { echo 'Configuração remota mudou; execute novamente.'; exit 1; }
          aws s3 cp /tmp/programming.json "s3://${R2_BUCKET}/programming.json" \
            --content-type 'application/json; charset=utf-8' --cache-control 'no-cache, max-age=0' --endpoint-url "$ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/programming.json" /tmp/programming-published.json --endpoint-url "$ENDPOINT"
          cmp /tmp/programming.json /tmp/programming-published.json
          python3 - <<'PYTHON'
          import json, os
          data = json.load(open('/tmp/programming-published.json'))
          text = f"Programming version {data['version']}: {len(data['stationIds'])} station IDs, {len(data['jingles'])} jingles."
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f: f.write(text + '\n')
          PYTHON

  inventory:
    name: Inspecionar biblioteca R2 (somente leitura)
    if: inputs.operation == 'inventory'
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Listar objetos disponíveis
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --query 'Contents[].{key:Key,size:Size,modified:LastModified}' --output json > /tmp/r2-inventory.json
          python3 - <<'PYTHON'
          import json
          for item in json.load(open('/tmp/r2-inventory.json')):
              if item['key'].lower().endswith('.mp3') and not item['key'].startswith('music/'):
                  print(json.dumps(item, ensure_ascii=False))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: r2-inventory
          path: /tmp/r2-inventory.json
          retention-days: 1
          if-no-files-found: error
