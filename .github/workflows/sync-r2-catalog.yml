name: Sincronizar catálogo R2

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Catálogo musical, peças aprovadas ou inventário
        type: choice
        default: music
        options: [music, programming, inventory, import_zip, flatten_music, restore_programming]

concurrency:
  group: r2-library-publication
  cancel-in-progress: false

permissions:
  contents: read

env:
  R2_ACCOUNT_ID: 6d1b0b06fe5ec1fc684e9ab00fca8e0f
  R2_BUCKET: tuaradio
  R2_PUBLIC_BASE: https://pub-e38948fd737d4d969bb4e65eebed0249.r2.dev
  R2_MUSIC_PREFIX: music/

jobs:
  access_key:
    name: 1A - Validar Access Key ID
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar R2_ACCESS_KEY_ID
        env:
          VALUE: ${{ secrets.R2_ACCESS_KEY_ID }}
        run: |
          test -n "$VALUE" || { echo "::error::R2_ACCESS_KEY_ID está ausente ou vazio"; exit 11; }
          echo "R2_ACCESS_KEY_ID disponível."

  secret_key:
    name: 1B - Validar Secret Access Key
    runs-on: ubuntu-latest
    steps:
      - name: Confirmar R2_SECRET_ACCESS_KEY
        env:
          VALUE: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          test -n "$VALUE" || { echo "::error::R2_SECRET_ACCESS_KEY está ausente ou vazio"; exit 12; }
          echo "R2_SECRET_ACCESS_KEY disponível."

  r2_access:
    name: 2 - Testar acesso ao R2
    needs: [access_key, secret_key]
    runs-on: ubuntu-latest
    steps:
      - name: Garantir AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y awscli
          fi
          aws --version

      - name: Testar bucket
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api head-bucket             --bucket "$R2_BUCKET"             --endpoint-url "$ENDPOINT"
          echo "Acesso ao bucket '$R2_BUCKET': OK"

  sync:
    if: inputs.operation == 'music' || inputs.operation == 'import_zip'
    name: 3 - Regenerar e publicar catálogo
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Garantir AWS CLI
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y awscli
          fi

      - name: Baixar catálogo anterior
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp             "s3://${R2_BUCKET}/music_catalog.json"             /tmp/old_music_catalog.json             --endpoint-url "$ENDPOINT"

      - name: Guardar backup do catálogo
        uses: actions/upload-artifact@v4
        with:
          name: music-catalog-backup
          path: /tmp/old_music_catalog.json
          retention-days: 30
          if-no-files-found: error

      - name: Preparar e testar importação ZIP
        if: inputs.operation == 'import_zip'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m unittest discover -s scripts -v

      - name: Extrair, validar e importar MP3 dos ZIPs
        if: inputs.operation == 'import_zip'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: python3 -u scripts/import_r2_zip.py --report /tmp/zip-import-report.json

      - name: Guardar relatório de importação
        if: always() && inputs.operation == 'import_zip'
        uses: actions/upload-artifact@v4
        with:
          name: zip-import-report
          path: /tmp/zip-import-report.json
          retention-days: 30
          if-no-files-found: warn

      - name: Listar biblioteca atual
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api list-objects-v2             --bucket "$R2_BUCKET"             --prefix "$R2_MUSIC_PREFIX"             --endpoint-url "$ENDPOINT"             --query 'Contents[].Key'             --output json > /tmp/r2_music_keys.json
          python3 - <<'PY'
          import json
          with open('/tmp/r2_music_keys.json', encoding='utf-8') as f:
              keys = json.load(f) or []
          count = sum(isinstance(k, str) and k.lower().endswith('.mp3') for k in keys)
          print(f"MP3 encontrados no R2: {count}")
          if count <= 0:
              raise SystemExit("Nenhum MP3 encontrado em music/")
          PY

      - name: Gerar catálogo
        run: |
          python3 scripts/sync_r2_catalog.py             --keys /tmp/r2_music_keys.json             --old-catalog /tmp/old_music_catalog.json             --output /tmp/music_catalog.json             --public-base "$R2_PUBLIC_BASE"             --prefix "$R2_MUSIC_PREFIX"

      - name: Publicar music_catalog.json
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp             /tmp/music_catalog.json             "s3://${R2_BUCKET}/music_catalog.json"             --content-type "application/json; charset=utf-8"             --cache-control "no-cache, max-age=0"             --endpoint-url "$ENDPOINT"

      - name: Validar catálogo publicado no próprio R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp             "s3://${R2_BUCKET}/music_catalog.json"             /tmp/published_music_catalog.json             --endpoint-url "$ENDPOINT"
          python3 - <<'PY'
          import json, os
          with open('/tmp/published_music_catalog.json', encoding='utf-8') as f:
              data = json.load(f)
          count = len(data.get('items', []))
          version = data.get('version')
          assert count > 0, 'Catálogo publicado ficou vazio'
          summary = f"Catálogo R2 sincronizado: versão {version}, {count} músicas."
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(summary + '\n')
          PY

  programming:
    name: Publicar programming.json oficial
    if: ${{ always() && needs.r2_access.result == 'success' && github.event.inputs.operation == 'programming' }}
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      PROGRAMMING_FILE: server/radio-alce/programming.json
    steps:
      - uses: actions/checkout@v4

      - name: Validar manifesto oficial e arquivos no R2
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          from urllib.parse import unquote, urlsplit

          path = os.environ['PROGRAMMING_FILE']
          data = json.load(open(path, encoding='utf-8'))

          assert data.get('stationId') == 'alce', 'stationId inválido'
          assert isinstance(data.get('version'), int), 'version inválida'
          assert isinstance(data.get('stationIds'), list) and data['stationIds'], 'stationIds vazio'
          assert isinstance(data.get('jingles'), list) and data['jingles'], 'jingles vazio'

          ids = set()
          urls = set()
          endpoint = 'https://' + os.environ['R2_ACCOUNT_ID'] + '.r2.cloudflarestorage.com'

          for pool_name in ('stationIds', 'jingles'):
              for item in data[pool_name]:
                  assert item.get('type') in ('STATION_ID', 'JINGLE'), 'type inválido'
                  assert item.get('id') and item.get('title') and item.get('url'), 'item incompleto'
                  assert item['id'] not in ids, 'ID duplicado: ' + item['id']
                  assert item['url'] not in urls, 'URL duplicada: ' + item['url']
                  ids.add(item['id'])
                  urls.add(item['url'])

                  url = urlsplit(item['url'])
                  assert url.scheme == 'https'
                  assert url.hostname == 'pub-e38948fd737d4d969bb4e65eebed0249.r2.dev'
                  assert not url.query and not url.fragment and url.path.lower().endswith('.mp3')

                  key = unquote(url.path.lstrip('/'))
                  result = subprocess.check_output([
                      'aws','s3api','head-object',
                      '--bucket', os.environ['R2_BUCKET'],
                      '--key', key,
                      '--endpoint-url', endpoint
                  ])
                  assert json.loads(result)['ContentLength'] > 0
                  print('Audio available:', item['id'])

          print(f"Manifesto válido: versão {data['version']}, {len(data['stationIds'])} vinhetas, {len(data['jingles'])} jingles")
          PYTHON

      - name: Baixar configuração atual e guardar backup
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          if aws s3 cp "s3://${R2_BUCKET}/programming.json" /tmp/programming-before.json --endpoint-url "$ENDPOINT"; then
            echo "Backup remoto obtido."
          else
            echo "::warning::programming.json remoto não encontrado; primeira publicação."
            printf '{}\n' > /tmp/programming-before.json
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: programming-backup
          path: /tmp/programming-before.json
          retention-days: 30
          if-no-files-found: error

      - name: Publicar manifesto oficial no R2
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "$PROGRAMMING_FILE" "s3://${R2_BUCKET}/programming.json" \
            --content-type 'application/json; charset=utf-8' \
            --cache-control 'no-cache, max-age=0' \
            --endpoint-url "$ENDPOINT"

      - name: Conferir publicação byte a byte
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp "s3://${R2_BUCKET}/programming.json" /tmp/programming-published.json --endpoint-url "$ENDPOINT"
          cmp "$PROGRAMMING_FILE" /tmp/programming-published.json
          python3 - <<'PYTHON'
          import json, os
          data = json.load(open('/tmp/programming-published.json', encoding='utf-8'))
          text = f"Programming version {data['version']}: {len(data['stationIds'])} station IDs, {len(data['jingles'])} jingles."
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write(text + '\n')
          PYTHON

  inventory:
    name: Inspecionar biblioteca R2 (somente leitura)
    if: inputs.operation == 'inventory'
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Listar objetos disponíveis
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3api list-objects-v2 --bucket "$R2_BUCKET" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --query 'Contents[].{key:Key,size:Size,modified:LastModified}' --output json > /tmp/r2-inventory.json
          python3 - <<'PYTHON'
          import json
          for item in json.load(open('/tmp/r2-inventory.json')):
              if (item['key'].lower().endswith('.zip') or 'zip' in item['key'].lower()
                      or (item['key'].lower().endswith('.mp3') and not item['key'].startswith('music/'))):
                  print(json.dumps(item, ensure_ascii=False))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: r2-inventory
          path: /tmp/r2-inventory.json
          retention-days: 1
          if-no-files-found: error

  flatten_music:
    name: Organizar MP3 sem subpastas
    if: inputs.operation == 'flatten_music'
    needs: r2_access
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - name: Testar migração
        run: python3 -m unittest discover -s scripts -p 'test_flatten_r2_music.py' -v
      - name: Preparar plano e backup
        run: python3 -u scripts/flatten_r2_music.py --stage plan --directory /tmp/flatten-music
      - uses: actions/upload-artifact@v4
        with:
          name: music-flatten-backup
          path: /tmp/flatten-music/
          retention-days: 30
          if-no-files-found: error
      - name: Copiar, verificar, atualizar catálogo e remover caminhos antigos
        run: python3 -u scripts/flatten_r2_music.py --stage apply --directory /tmp/flatten-music

  restore_programming:
    name: Restaurar configuração completa de programação
    if: inputs.operation == 'restore_programming'
    needs: r2_access
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: programming-backup
          run-id: 38284315382
          github-token: ${{ github.token }}
          path: /tmp/recovery
      - name: Recuperar backup e mesclar peças aprovadas
        run: |
          python3 scripts/update_r2_programming.py --current /tmp/recovery/programming-before.json --additions scripts/jingle-additions.json --output /tmp/recovery/merged.json
          python3 scripts/update_r2_programming.py --current /tmp/recovery/merged.json --additions scripts/station-id-additions.json --output /tmp/recovery/programming.json
          python3 - <<'PYTHON'
          import json, os, subprocess
          from urllib.parse import unquote, urlsplit
          p = '/tmp/recovery/programming.json'
          data = json.load(open(p))
          data['version'] = max(data['version'], 10)
          endpoint = 'https://' + os.environ['R2_ACCOUNT_ID'] + '.r2.cloudflarestorage.com'
          for pool in ('stationIds', 'jingles'):
              valid = []
              for item in data[pool]:
                  result = subprocess.run(['aws', 's3api', 'head-object', '--bucket', os.environ['R2_BUCKET'], '--key', unquote(urlsplit(item['url']).path.lstrip('/')), '--endpoint-url', endpoint], capture_output=True, text=True)
                  if result.returncode and '(404)' in result.stderr:
                      print('Removed obsolete reference (R2 404):', item['id'])
                      continue
                  if result.returncode:
                      raise SystemExit('Unable to validate audio: ' + item['id'])
                  assert json.loads(result.stdout)['ContentLength'] > 0
                  valid.append(item)
              assert valid, 'No valid audio in ' + pool
              data[pool] = valid
          with open(p, 'w') as f: json.dump(data, f, ensure_ascii=False, indent=2); f.write('\n')
          print('Validated:', len(data['stationIds']), 'station IDs;', len(data['jingles']), 'jingles')
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: programming-restoration
          path: /tmp/recovery/
          retention-days: 30
      - name: Criar somente se programming.json continuar ausente
        run: |
          ENDPOINT="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3api put-object --bucket "$R2_BUCKET" --key programming.json --body /tmp/recovery/programming.json --if-none-match '*' --content-type 'application/json; charset=utf-8' --cache-control 'no-cache, max-age=0' --endpoint-url "$ENDPOINT"
          aws s3 cp "s3://${R2_BUCKET}/programming.json" /tmp/published.json --endpoint-url "$ENDPOINT"
          cmp /tmp/recovery/programming.json /tmp/published.json
