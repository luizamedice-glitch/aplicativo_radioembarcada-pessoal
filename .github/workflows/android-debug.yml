name: Android debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Confirm build environment
        run: |
          java -version
          javac -version
          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"
          ./gradlew --version
      - name: Prepare server audio fixtures
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - name: Server programming tests
        run: python3 -m unittest discover -s server/radio-alce/tests -v
      - name: Liquidsoap syntax
        env:
          ICECAST_SOURCE_PASSWORD: syntax-check-only
        run: |
          docker run --rm -e ICECAST_SOURCE_PASSWORD \
            -v "$PWD/server/radio-alce/liquidsoap:/scripts:ro" \
            --entrypoint liquidsoap \
            savonet/liquidsoap:v2.4.x-latest@sha256:f19e1ca92320459d5fad5265e0844cc7ae92501d686f788e43ca8a9d6bec44cc \
            --check /scripts/radio.liq
      - name: Audio amplitude and emergency integration
        run: |
          docker build -t alce-catalog-validation -f server/radio-alce/Dockerfile.catalog server/radio-alce
          python3 server/radio-alce/tests/validate_audio_pipeline.py
          ALCE_TEST_TRANSITIONS=1 python3 server/radio-alce/tests/validate_runtime.py
          ALCE_TEST_EMERGENCY=1 python3 server/radio-alce/tests/validate_runtime.py
      - name: Unit tests
        # Run resource-dependent variants separately; both suites remain required.
        run: |
          ./gradlew testDebugUnitTest -PplaybackMode=STREAM --warning-mode all --max-workers=2
          ./gradlew testReleaseUnitTest -PplaybackMode=STREAM --warning-mode all --max-workers=2
      - name: Android lint
        run: ./gradlew lintDebug -PplaybackMode=STREAM --warning-mode all --max-workers=2
      - name: Assemble debug APK
        run: ./gradlew assembleDebug -PplaybackMode=STREAM --warning-mode all --max-workers=2
      - name: Confirm debug APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          import zipfile
          reports = pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')
          roots = [ET.parse(report).getroot() for report in reports]
          assert roots, 'Relatórios de testes ausentes'
          totals = {key: sum(int(root.get(key, 0)) for root in roots)
                    for key in ('tests', 'failures', 'errors')}
          assert not totals['failures'] and not totals['errors'], 'Testes falharam'
          issues = ET.parse('app/build/reports/lint-results-debug.xml').getroot().findall('issue')
          errors = sum(issue.get('severity') in ('Error', 'Fatal') for issue in issues)
          warnings = sum(issue.get('severity') == 'Warning' for issue in issues)
          assert not errors, 'Lint contém erros'
          from collections import Counter
          warning_ids = Counter(issue.get('id') for issue in issues if issue.get('severity') == 'Warning')
          print('Avisos de lint por categoria: ' + ', '.join(
              f'{identifier}: {count}' for identifier, count in sorted(warning_ids.items())))
          apk_path = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          with zipfile.ZipFile(apk_path, metadata_encoding='utf-8') as apk:
              music_count = sum(name.lower().endswith('.mp3') for name in apk.namelist())
              assert music_count == 0, 'O APK remoto não pode conter MP3 empacotados'
          print(f'APK: {apk_path.stat().st_size} bytes ({apk_path.stat().st_size / (1024 ** 2):.1f} MiB); assets/music/: {music_count} MP3.')
          summary = (f"Testes: {totals['tests']} aprovados. Lint: {errors} erros, {warnings} avisos. "
                     f"APK verificado; MP3 incluídos: {music_count}.")
          print("Playback mode: STREAM; one central station; no local programming")
          print(summary)
          import os
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write(summary + '\n\nArtifact: **radio-embarcada-debug-apk**, contendo **app-debug.apk**.\n')
          PY
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: radio-embarcada-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
