name: radio-alce-hls-test
services:
  encoder:
    profiles: [test]
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      AWS_EC2_METADATA_DISABLED: 'true'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - hls-output:/output
    read_only: true
    tmpfs: [/tmp:size=16m]
    mem_limit: 192m
    cpus: 0.50
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
    healthcheck:
      test: [CMD, python, health.py]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 3
  preview:
    profiles: [test]
    image: nginxinc/nginx-unprivileged:1.28-alpine
    ports: ['127.0.0.1:8083:8080']
    volumes:
      - hls-output:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    mem_limit: 32m
    cpus: 0.10
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
volumes:
  hls-output:
