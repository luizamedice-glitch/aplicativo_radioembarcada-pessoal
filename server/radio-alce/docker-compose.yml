services:
  icecast:
    build:
      context: ./icecast
    container_name: radio-alce-icecast
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - icecast-logs:/var/log/icecast2
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:8000/status-json.xsl > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5

  stats:
    build:
      context: .
      dockerfile: Dockerfile.stats
    container_name: radio-alce-stats
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
    environment:
      STATS_USER: ${STATS_USER:-radioadmin}
      STATS_PASSWORD: ${STATS_PASSWORD:?Run setup.sh first}
      ICECAST_STATUS_URL: http://icecast:8000/status-json.xsl
      RADIO_MOUNT: /alce.mp3
      TZ: America/Sao_Paulo
    volumes:
      - icecast-logs:/var/log/icecast2:ro
    ports:
      - "8082:8082"

  catalog:
    build:
      context: .
      dockerfile: Dockerfile.catalog
    container_name: radio-alce-catalog
    restart: unless-stopped
    environment:
      FREETTS_API_KEY: ${FREETTS_API_KEY:-}
      FREETTS_VOICE: ${FREETTS_VOICE:-pt-BR-AntonioNeural}
      TZ: America/Sao_Paulo
    volumes:
      - radio-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health',timeout=3)"]
      start_period: 300s
      interval: 15s
      timeout: 5s
      retries: 5

  liquidsoap:
    # Pin the syntax/runtime actually validated (2.4.6), rather than a moving latest tag.
    image: savonet/liquidsoap:v2.4.x-latest@sha256:f19e1ca92320459d5fad5265e0844cc7ae92501d686f788e43ca8a9d6bec44cc
    container_name: radio-alce-liquidsoap
    restart: unless-stopped
    depends_on:
      icecast:
        condition: service_healthy
      catalog:
        condition: service_healthy
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?Run setup.sh first}
      TZ: America/Sao_Paulo
    volumes:
      - ${LIQUIDSOAP_CONFIG:-./liquidsoap/radio.liq}:/radio.liq:ro
      - radio-data:/data
    command: ["liquidsoap", "/radio.liq"]
    healthcheck:
      test: ["CMD-SHELL", "test -f /data/liquidsoap.heartbeat && [ $$(( $$(date +%s) - $$(stat -c %Y /data/liquidsoap.heartbeat) )) -lt 60 ]"]
      start_period: 30s
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  radio-data:
  icecast-logs:
